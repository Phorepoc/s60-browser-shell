# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml). No engine and no Qt in them:
# the engines (WebKit, NetSurf) are their own Catalogue packages.
NAME=s60-browser-shell
ARCHES="arm x32"
IMAGE=ghcr.io/phorepoc/base
# webengine: the engine interface (headers only)
REPOS_arm="webengine"
REPOS_x32="webengine"
COMPONENTS_arm="phebrowser_arm"
COMPONENTS_x32="phebrowser"
